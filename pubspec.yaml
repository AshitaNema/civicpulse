name: civicpulse
description: "CivicPulse - AI-Powered Civic Issue Reporting & Verification Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  flutter_dotenv: ^5.2.1
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  http: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
